<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="description" content="A todo app for the ODIN project" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Todo App</title>
  </head>
  <body>
    <div class="main-content"></div>
    <dialog id="edit-task-dialog">
      <form method="dialog" class="edit-task-form" id="editTaskForm">
        <h1>Edit Task</h1>
        <div class="form-row">
          <div class="form-group">
            <label for="edit-task-title">Title</label>
            <input
              type="text"
              id="edit-task-title"
              name="edit-task-title"
              required
            />
          </div>
          <div class="form-group">
            <label for="edit-task-due-date">Due Date</label>
            <input
              type="date"
              id="edit-task-due-date"
              name="edit-task-due-date"
              required
            />
          </div>
          <div class="form-group">
            <label for="edit-task-priority">Priority</label>
            <select name="edit-task-priority" id="edit-task-priority">
              <option value="Low">Low</option>
              <option value="Medium">Medium</option>
              <option value="High">High</option>
              <option value="Urgent">Urgent</option>
            </select>
          </div>
          <div class="form-group">
            <label for="edit-task-description">Description</label>
            <input
              type="text"
              id="edit-task-description"
              name="edit-task-description"
            />
          </div>
          <div class="form-group">
            <label for="edit-task-notes">Notes</label>
            <input type="text" id="edit-task-notes" name="edit-task-notes" />
          </div>
          <div class="form-controls">
            <button type="submit" id="update-task-btn">Update</button>
            <button type="button" id="cancel-update-btn">Cancel</button>
          </div>
        </div>
        <p class="edit-task-error" role="alert"></p>
      </form>
    </dialog>
  </body>
</html>
