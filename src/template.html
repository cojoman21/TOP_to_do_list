<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="description" content="A todo app for the ODIN project" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Todo App</title>
  </head>
  <body>
    <div class="main-content"></div>
    <dialog id="edit-task-dialog">
      <form action="./" method="post" class="edit-task-form" id="editTaskForm">
        <h1>Edit Task</h1>
        <div class="form-row">
          <div class="form-group">
            <label for="task-title">Title</label>
            <input type="text" id="task-title" name="task-title" />
          </div>
          <div class="form-group">
            <label for="task-due-date">Due Date</label>
            <input type="date" id="task-due-date" name="task-due-date" />
          </div>
          <div class="form-group">
            <label for="task-priority">Priority</label>
            <select name="task-priority" id="task-priority">
              <option value="" id="original-priority"></option>
              <option value="Low">Low</option>
              <option value="Medium">Medium</option>
              <option value="High">High</option>
              <option value="Urgent">Urgent</option>
            </select>
          </div>
          <div class="form-group">
            <label for="task-description">Description</label>
            <input type="text" id="task-description" name="task-description" />
          </div>
          <div class="form-group">
            <label for="task-notes">Notes</label>
            <input type="text" id="task-notes" name="task-notes" />
          </div>
        </div>
      </form>
    </dialog>
  </body>
</html>
